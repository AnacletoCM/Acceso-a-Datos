name: RA1 - DGT
run-name: RA1 - DGT

on:
  push:
    branches: [main]
    paths:
      - 'actividades/ra1_ptp_dgt_traffic_radar/**'
      - '.github/workflows/traffic-radar.yml'
  pull_request:
    paths:
      - 'actividades/ra1_ptp_dgt_traffic_radar/**'
      - '.github/workflows/traffic-radar.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  comprobar:
    name: TrafficAlert · Windows · Java 21
    runs-on: windows-latest
    timeout-minutes: 12
    steps:
      - uses: actions/checkout@v7
        with:
          persist-credentials: false
      - uses: actions/setup-java@v6
        with:
          distribution: temurin
          java-version: '21'
          cache: maven
          cache-dependency-path: actividades/ra1_ptp_dgt_traffic_radar/pom.xml
      - name: Pruebas
        run: mvn -B -ntp -f actividades/ra1_ptp_dgt_traffic_radar/pom.xml clean verify
